name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typen, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatierung
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typen
        # Route types (LayoutProps, PageProps) are generated by Next, not checked in.
        run: |
          npx next typegen
          npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Handy-Schriftgrössen aktuell
        run: |
          npm run styles:mobile-type
          git diff --exit-code app/styles/39-mobile-type.css
      - name: Build
        run: npx next build

  database:
    name: Datenbank-Tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carecore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carecore_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrationen auf frischer Datenbank
        run: npm run test:db:setup
      - name: Seed zweimal (idempotent)
        run: |
          npm run test:db:seed
          npm run test:db:seed
      - name: Integrationstests
        run: npm run test:db
